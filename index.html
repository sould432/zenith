<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>업무 칠판</title>
<style>
body{margin:0;font-family:sans-serif;background:#1f2937;color:#fff}
.toolbar{position:fixed;top:0;left:0;right:0;padding:10px;background:#111827;display:flex;gap:8px;z-index:10}
#board{padding-top:60px;height:100vh;overflow:auto}
.note{position:absolute;width:220px;padding:12px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:move;color:#111}
.normal{background:#fde68a}.high{background:#fdba74}.urgent{background:#fca5a5}.low{background:#93c5fd}
.completed{opacity:.5;text-decoration:line-through}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
.box{background:#fff;color:#000;padding:16px;border-radius:12px;width:350px}
input,textarea,select{width:100%;margin:6px 0}
</style>
</head>
<body>
<div class="toolbar">
<button onclick="openModal()">업무 추가</button>
<button onclick="autoArrange()">자동 정렬</button>
<input id="search" placeholder="검색" oninput="render()">
</div>
<div id="board"></div>

<div id="modal">
<div class="box">
<textarea id="txt" placeholder="업무"></textarea>
<input id="alarm" type="datetime-local">
<select id="priority">
<option value="urgent">긴급</option>
<option value="high">높음</option>
<option value="normal" selected>보통</option>
<option value="low">낮음</option>
</select>
<button onclick="saveNote()">저장</button>
</div>
</div>

<script>
let notes=JSON.parse(localStorage.getItem('notes')||'[]');
let editId=null;

function persist(){localStorage.setItem('notes',JSON.stringify(notes));}

function openModal(id=null){
 editId=id;
 modal.style.display='flex';
 if(id){
  let n=notes.find(x=>x.id===id);
  txt.value=n.text; alarm.value=n.alarm||''; priority.value=n.priority||'normal';
 } else { txt.value=''; alarm.value=''; priority.value='normal';}
}

function saveNote(){
 let text=txt.value.trim();
 if(!text)return;
 if(editId){
   let n=notes.find(x=>x.id===editId);
   n.text=text;n.alarm=alarm.value;n.priority=priority.value;
 }else{
   notes.push({id:Date.now(),text,alarm:alarm.value,priority:priority.value,x:30,y:80,completed:false});
   autoArrange(false);
 }
 persist(); render(); modal.style.display='none';
}

txt.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveNote();}
});

function render(){
 board.innerHTML='';
 let q=search.value.toLowerCase();
 notes.filter(n=>n.text.toLowerCase().includes(q)).forEach(n=>{
   let d=document.createElement('div');
   d.className='note '+(n.priority||'normal')+(n.completed?' completed':'');
   d.style.left=n.x+'px'; d.style.top=n.y+'px';
   d.innerHTML=`<b>${n.text}</b><hr>
   <small>${n.alarm||''}</small><br>
   <button onclick="event.stopPropagation();openModal(${n.id})">수정</button>
   <button onclick="event.stopPropagation();toggle(${n.id})">완료</button>
   <button onclick="event.stopPropagation();del(${n.id})">삭제</button>`;
   drag(d,n);
   board.appendChild(d);
 });
}
function toggle(id){let n=notes.find(x=>x.id===id);n.completed=!n.completed;persist();render();}
function del(id){if(confirm('정말 삭제하시겠습니까?')){notes=notes.filter(x=>x.id!==id);persist();render();}}

function autoArrange(save=true){
 let cols=Math.max(1,Math.floor(window.innerWidth/260));
 notes.forEach((n,i)=>{n.x=20+(i%cols)*250;n.y=80+Math.floor(i/cols)*220;});
 if(save)persist(); render();
}

function drag(el,n){
 let down=false,ox,oy;
 el.onmousedown=e=>{down=true;ox=e.clientX-n.x;oy=e.clientY-n.y;};
 window.onmousemove=e=>{if(!down)return;n.x=e.clientX-ox;n.y=e.clientY-oy;el.style.left=n.x+'px';el.style.top=n.y+'px';};
 window.onmouseup=()=>{if(down){down=false;persist();}};
}

if("Notification" in window) Notification.requestPermission();
setInterval(()=>{
 let now=Date.now();
 notes.forEach(n=>{
  if(n.completed||!n.alarm)return;
  let t=new Date(n.alarm).getTime();
  if(!n.notified && now>=t){
   n.notified=true;
   alert('업무 알림: '+n.text);
   if(Notification.permission==='granted') new Notification('업무 알림',{body:n.text});
   persist();
  }
 });
},1000);

render();
</script>
</body>
</html>
